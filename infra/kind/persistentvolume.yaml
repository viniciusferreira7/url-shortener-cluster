apiVersion: v1
kind: PersistentVolume

metadata:
  name: url-shortener-persistent-volume
  labels:
    name: url-shortener-persistent-volume

spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: standard
  hostPath: 
    path: /mnt/data